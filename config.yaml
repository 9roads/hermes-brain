model:
  provider: custom
  default: gpt-5.5
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  api_mode: codex_responses

fallback_providers:
  - provider: openrouter
    model: moonshotai/kimi-k2.6
    key_env: OPENROUTER_API_KEY
    reasoning_effort: xhigh

approvals:
  mode: off

terminal:
  cwd: /opt/data/workspace
  env_passthrough:
    - SLACK_BOT_TOKEN
    - SLACK_TOKEN
    - KERNEL_API_KEY

agent:
  max_turns: 90
  gateway_notify_interval: 0
  reasoning_effort: xhigh
  text_verbosity: low
  disabled_toolsets:
    - web
    - browser

auxiliary:
  compression:
    provider: openrouter
    model: deepseek/deepseek-v4-flash
  title_generation:
    provider: openrouter
    model: deepseek/deepseek-v4-flash

context:
  engine: lcm

plugins:
  enabled:
    - hermes-lcm
    - loisa-composio-session
    - loisa-slack-markdown-blocks
    - loisa-slack-thread-gate
    - loisa-slack-home
    - loisa-trigger-subscriptions
    - loisa-openai-text-verbosity
  entries:
    loisa-slack-thread-gate:
      provider: openrouter
      model: deepseek/deepseek-v4-pro
      llm:
        allow_provider_override: true
        allowed_providers:
          - openrouter
        allow_model_override: true
        allowed_models:
          - deepseek/deepseek-v4-pro

display:
  busy_input_mode: steer
  busy_ack_enabled: false
  interim_assistant_messages: false
  status_messages: "off"
  platforms:
    slack:
      tool_progress: "off"

onboarding:
  seen:
    busy_input_prompt: true

platforms:
  webhook:
    enabled: true
    extra:
      host: 0.0.0.0
      port: 8644
      secret: ${WEBHOOK_SECRET}
  slack:
    gateway_restart_notification: false
    extra:
      allow_admin_from:
        - "__loisa_no_slack_admins__"
      group_allow_admin_from:
        - "__loisa_no_slack_admins__"
      user_allowed_commands:
        - loisa
      group_user_allowed_commands:
        - loisa

memory:
  provider: openviking_memory
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2000
  user_char_limit: 1375

cron:
  wrap_response: false
  script_timeout_seconds: 120

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  max_spawn: 5
  max_in_progress: 5

file_read_max_chars: 100000

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

skills:
  external_dirs:
    - distribution-skills
  disabled:
