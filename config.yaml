model:
  provider: custom
  default: gpt-5.5
  base_url: ${OPENAI_BASE_URL}
  api_mode: codex_responses

approvals:
  mode: smart

terminal:
  cwd: /opt/data/workspace

agent:
  max_turns: 90
  gateway_notify_interval: 0
  reasoning_effort: xhigh
  text_verbosity: low
  disabled_toolsets: []

auxiliary:
  compression:
    provider: main
    model: gpt-5.4-mini

plugins:
  enabled:
    - phoenix-composio-session
    - phoenix-slack-markdown-blocks
    - phoenix-slack-thread-gate
    - phoenix-slack-home
    - phoenix-slack-surface
    - phoenix-trigger-subscriptions
    - phoenix-openai-text-verbosity
  entries:
    phoenix-slack-thread-gate:
      model: gpt-5.4-mini
      llm:
        allow_model_override: true
        allowed_models:
          - gpt-5.4-mini

display:
  busy_input_mode: steer
  busy_ack_enabled: false
  interim_assistant_messages: false
  platforms:
    slack:
      tool_progress: "off"

onboarding:
  seen:
    busy_input_prompt: true

platforms:
  webhook:
    enabled: true
    extra:
      host: 0.0.0.0
      port: 8644
      secret: ${WEBHOOK_SECRET}
  slack:
    gateway_restart_notification: false
    extra:
      allow_admin_from:
        - "__phoenix_no_slack_admins__"
      group_allow_admin_from:
        - "__phoenix_no_slack_admins__"
      user_allowed_commands:
        - phoenix
      group_user_allowed_commands:
        - phoenix

memory:
  provider: openviking_memory
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2000
  user_char_limit: 1375

cron:
  wrap_response: false
  script_timeout_seconds: 120

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  max_spawn: 5
  max_in_progress: 5

file_read_max_chars: 100000

tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000

