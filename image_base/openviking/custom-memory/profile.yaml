memory_type: profile
description: |
  Disabled in Loisa Hermes.

  OpenViking's built-in profile memory is for an individual user profile. Loisa
  Hermes uses OpenViking for shared company memory, so user/person identity must
  not be extracted into profile.md.
directory: "viking://user/{{ user_space }}/memories"
filename_template: "profile.md"
enabled: false
fields:
  - name: content
    type: string
    description: "Disabled profile content."
    merge_op: patch
