{
  "default_account": "default",
  "default_user": "default",
  "default_agent": "hermes-memory",
  "storage": {
    "workspace": "/opt/data/openviking/workspace",
    "vectordb": {
      "name": "context",
      "backend": "local"
    },
    "agfs": {
      "backend": "local",
      "queuefs": {
        "mode": "shared",
        "backend": "sqlite",
        "db_path": "/opt/data/openviking/workspace/_system/queue/queue.db",
        "busy_timeout_ms": 5000
      }
    }
  },
  "server": {
    "host": "127.0.0.1",
    "port": 1933,
    "auth_mode": "dev"
  },
  "embedding": {
    "max_concurrent": 8,
    "max_retries": 3,
    "text_source": "content_only",
    "max_input_tokens": 4096,
    "dense": {
      "provider": "openai",
      "api_base": "${OPENAI_BASE_URL}",
      "api_key": "${OPENAI_API_KEY}",
      "model": "text-embedding-3-small",
      "dimension": 1536,
      "encoding_format": "float"
    }
  },
  "vlm": {
    "provider": "openrouter",
    "api_base": "https://openrouter.ai/api/v1",
    "api_key": "${OPENROUTER_API_KEY}",
    "model": "deepseek/deepseek-v4-pro",
    "max_concurrent": 4,
    "max_retries": 2,
    "timeout": 180,
    "extra_request_body": {
      "reasoning": {
        "effort": "high"
      }
    }
  },
  "log": {
    "level": "INFO",
    "output": "stdout"
  },
  "memory": {
    "version": "v2",
    "custom_templates_dir": "/opt/hermes/openviking/custom-memory"
  }
}
