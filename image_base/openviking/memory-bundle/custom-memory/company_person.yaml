memory_type: company_person

description: |
  Company person memory.

  High priority:
  - full name, aliases, role/title
  - team membership
  - manager / reports
  - ownership areas
  - responsibilities
  - decision rights
  - current projects
  - business-relevant working context

  Rules:
  - Never infer reporting lines from casual collaboration.
  - Never infer team membership from one meeting or message.
  - Distinguish employees, contractors, advisors, vendors, customers, candidates.
  - Do not store irrelevant private personal facts.
  - Preserve conflicts instead of overwriting silently.
  - Prefer "unknown" over guessing.

directory: "viking://user/{{ user_space }}/memories/people"
filename_template: "{{ person_slug }}.md"
enabled: true
operation_mode: "upsert"

overview_template: |-
  # People
  {% for item in items %}
  - [{{ item.file_content.full_name|default(item.file_content.person_slug, true) }}](./{{ item.file_name }})
    - role: {{ item.file_content.role_title|default("unknown", true) }};
    team: {{ item.file_content.team_slug|default("unknown", true) }};
    manager: {{ item.file_content.manager_slug|default("unknown", true) }}
  {% endfor %}

content_template: |-
  # {{ full_name|default(person_slug, true) }}

  ## Basic info
  - Slug: {{ person_slug|default("unknown", true) }}
  - Aliases: {{ aliases|default("unknown", true) }}
  - Status: {{ status|default("unknown", true) }}
  - Role/title: {{ role_title|default("unknown", true) }}
  - Team: {{ team_slug|default("unknown", true) }}
  - Manager: {{ manager_slug|default("unknown", true) }}
  - Last observed: {{ last_observed|default("unknown", true) }}
  - Confidence: {{ confidence|default("medium", true) }}

  ## Responsibilities
  {{ responsibilities|default("Unknown.", true) }}

  ## Ownership / decision rights
  {{ ownership|default("Unknown.", true) }}

  ## Current projects
  {{ current_projects|default("Unknown.", true) }}

  ## Working context
  {{ working_context|default("Unknown.", true) }}

  ## Org chart notes
  {{ org_notes|default("Unknown.", true) }}

  ## Conflicts / uncertainty
  {{ conflicts|default("None recorded.", true) }}

  ## Custom properties
  {{ custom_properties|default("None recorded.", true) }}

  ## Custom sections
  {{ custom_sections|default("None recorded.", true) }}

  ## Evidence
  {{ evidence|default("Source metadata not available.", true) }}

fields:
  - name: person_slug
    type: string
    description: "Stable slug for the person."
    merge_op: immutable
    searchable: true
  - name: full_name
    type: string
    description: "Full name when explicitly known."
    merge_op: patch
    searchable: true
  - name: aliases
    type: string
    description: "Known aliases, handles, or nicknames."
    merge_op: patch
    searchable: true
  - name: status
    type: string
    description: "Employee, contractor, advisor, vendor, customer, candidate, or unknown."
    merge_op: patch
    searchable: true
  - name: role_title
    type: string
    description: "Role or title."
    merge_op: patch
    searchable: true
  - name: team_slug
    type: string
    description: "Team membership only when explicitly known."
    merge_op: patch
    searchable: true
  - name: manager_slug
    type: string
    description: "Manager only when explicitly stated."
    merge_op: patch
    searchable: true
  - name: responsibilities
    type: string
    description: "Responsibilities and recurring duties."
    merge_op: patch
    searchable: true
  - name: ownership
    type: string
    description: "Ownership areas and decision rights."
    merge_op: patch
    searchable: true
  - name: current_projects
    type: string
    description: "Current projects or initiatives."
    merge_op: patch
    searchable: true
  - name: working_context
    type: string
    description: "Work-relevant collaboration context."
    merge_op: patch
    searchable: true
  - name: org_notes
    type: string
    description: "Org chart notes and reporting uncertainty."
    merge_op: patch
    searchable: true
  - name: conflicts
    type: string
    description: "Contradictions or uncertainty."
    merge_op: patch
    searchable: true
  - name: confidence
    type: string
    description: "low, medium, or high."
    merge_op: patch
  - name: last_observed
    type: string
    description: "Most recent observation date."
    merge_op: patch
  - name: custom_properties
    type: string
    description: "YAML-like key/value properties for durable company facts that belong to this memory but do not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: custom_sections
    type: string
    description: "Markdown sections for durable company knowledge that belongs to this memory but does not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: evidence
    type: string
    description: "Source metadata present in the input. Do not fabricate exact sources."
    merge_op: patch
    searchable: true
