memory_type: company_decision

description: |
  Company decision memory.

  Use for durable decisions:
  - strategy choices
  - pricing/package choices
  - hiring/org choices
  - customer commitments
  - product/engineering architecture choices
  - policy/process decisions
  - reversals or supersessions

  Rules:
  - If it is only proposed, status must be proposed.
  - If it is final/accepted, status must be accepted or active.
  - If later replaced, do not delete; mark superseded and link to new decision.
  - Include rationale, owner/approver, consequences, follow-ups, and evidence.
  - Convert relative dates to YYYY-MM-DD when possible.

directory: "viking://user/{{ user_space }}/memories/decisions"
filename_template: "{{ decision_date }}-{{ decision_slug }}.md"
enabled: true
operation_mode: "upsert"

overview_template: |-
  # Decisions
  {% for item in items %}
  - [{{ item.file_content.decision_date|default("", true) }} - {{ item.file_content.title|default(item.file_content.decision_slug, true) }}](./{{ item.file_name }})
    - status: {{ item.file_content.status|default("unknown", true) }};
    owner: {{ item.file_content.owner_slug|default("unknown", true) }}
  {% endfor %}

content_template: |-
  # {{ title|default(decision_slug, true) }}

  ## Basic info
  - Slug: {{ decision_slug|default("unknown", true) }}
  - Date: {{ decision_date|default("unknown", true) }}
  - Status: {{ status|default("proposed", true) }}
  - Owner / approver: {{ owner_slug|default("unknown", true) }}
  - Affected teams: {{ affected_teams|default("unknown", true) }}
  - Confidence: {{ confidence|default("medium", true) }}

  ## Decision
  {{ decision|default("Unknown.", true) }}

  ## Context
  {{ context|default("Unknown.", true) }}

  ## Rationale
  {{ rationale|default("Unknown.", true) }}

  ## Alternatives considered
  {{ alternatives|default("Unknown.", true) }}

  ## Consequences
  {{ consequences|default("Unknown.", true) }}

  ## Follow-ups
  {{ followups|default("None recorded.", true) }}

  ## Supersession
  - Supersedes: {{ supersedes|default("None", true) }}
  - Superseded by: {{ superseded_by|default("None", true) }}

  ## Custom properties
  {{ custom_properties|default("None recorded.", true) }}

  ## Custom sections
  {{ custom_sections|default("None recorded.", true) }}

  ## Evidence
  {{ evidence|default("Source metadata not available.", true) }}

fields:
  - name: decision_date
    type: string
    description: "Decision date as YYYY-MM-DD when possible."
    merge_op: patch
    searchable: true
  - name: decision_slug
    type: string
    description: "Stable decision slug."
    merge_op: immutable
    searchable: true
  - name: title
    type: string
    description: "Short human-readable decision title."
    merge_op: patch
    searchable: true
  - name: status
    type: string
    description: "proposed, accepted, active, superseded, rejected, or unknown."
    merge_op: patch
    searchable: true
  - name: owner_slug
    type: string
    description: "Owner or approver when explicitly known."
    merge_op: patch
    searchable: true
  - name: affected_teams
    type: string
    description: "Affected teams."
    merge_op: patch
    searchable: true
  - name: decision
    type: string
    description: "The decision itself."
    merge_op: patch
    searchable: true
  - name: context
    type: string
    description: "Context that led to the decision."
    merge_op: patch
    searchable: true
  - name: rationale
    type: string
    description: "Rationale."
    merge_op: patch
    searchable: true
  - name: alternatives
    type: string
    description: "Alternatives considered."
    merge_op: patch
    searchable: true
  - name: consequences
    type: string
    description: "Consequences and implications."
    merge_op: patch
    searchable: true
  - name: followups
    type: string
    description: "Follow-up actions."
    merge_op: patch
    searchable: true
  - name: supersedes
    type: string
    description: "Prior decision superseded by this one."
    merge_op: patch
    searchable: true
  - name: superseded_by
    type: string
    description: "Later decision that supersedes this one."
    merge_op: patch
    searchable: true
  - name: confidence
    type: string
    description: "low, medium, or high."
    merge_op: patch
  - name: custom_properties
    type: string
    description: "YAML-like key/value properties for durable company facts that belong to this memory but do not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: custom_sections
    type: string
    description: "Markdown sections for durable company knowledge that belongs to this memory but does not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: evidence
    type: string
    description: "Source metadata present in the input. Do not fabricate exact sources."
    merge_op: patch
    searchable: true
