memory_type: company_team

description: |
  Company team memory.

  Use for departments, pods, working groups, agency service units, or functional areas.

  High priority:
  - team name, slug, lead
  - parent team
  - members
  - charter
  - responsibilities
  - owned projects/systems/accounts
  - interfaces with other teams
  - recurring rituals

  Rules:
  - Do not infer membership from one-off collaboration.
  - Distinguish permanent teams from temporary project groups.
  - Org chart facts are high priority.

directory: "viking://user/{{ user_space }}/memories/teams"
filename_template: "{{ team_slug }}.md"
enabled: true
operation_mode: "upsert"

overview_template: |-
  # Teams
  {% for item in items %}
  - [{{ item.file_content.team_name|default(item.file_content.team_slug, true) }}](./{{ item.file_name }})
    - lead: {{ item.file_content.lead_slug|default("unknown", true) }};
    parent: {{ item.file_content.parent_team_slug|default("none", true) }}
  {% endfor %}

content_template: |-
  # {{ team_name|default(team_slug, true) }}

  ## Basic info
  - Slug: {{ team_slug|default("unknown", true) }}
  - Parent team: {{ parent_team_slug|default("none", true) }}
  - Lead: {{ lead_slug|default("unknown", true) }}
  - Status: {{ status|default("active", true) }}
  - Last observed: {{ last_observed|default("unknown", true) }}
  - Confidence: {{ confidence|default("medium", true) }}

  ## Charter
  {{ charter|default("Unknown.", true) }}

  ## Responsibilities
  {{ responsibilities|default("Unknown.", true) }}

  ## Members
  {{ members|default("Unknown.", true) }}

  ## Owned assets
  {{ owned_assets|default("Unknown.", true) }}

  ## Interfaces / dependencies
  {{ interfaces|default("Unknown.", true) }}

  ## Rituals / recurring meetings
  {{ rituals|default("Unknown.", true) }}

  ## Conflicts / uncertainty
  {{ conflicts|default("None recorded.", true) }}

  ## Custom properties
  {{ custom_properties|default("None recorded.", true) }}

  ## Custom sections
  {{ custom_sections|default("None recorded.", true) }}

  ## Evidence
  {{ evidence|default("Source metadata not available.", true) }}

fields:
  - name: team_slug
    type: string
    description: "Stable slug for the team."
    merge_op: immutable
    searchable: true
  - name: team_name
    type: string
    description: "Canonical team name."
    merge_op: patch
    searchable: true
  - name: parent_team_slug
    type: string
    description: "Parent team when explicitly known."
    merge_op: patch
    searchable: true
  - name: lead_slug
    type: string
    description: "Team lead when explicitly known."
    merge_op: patch
    searchable: true
  - name: status
    type: string
    description: "active, inactive, temporary, or unknown."
    merge_op: patch
  - name: charter
    type: string
    description: "Team charter."
    merge_op: patch
    searchable: true
  - name: responsibilities
    type: string
    description: "Responsibilities and scope."
    merge_op: patch
    searchable: true
  - name: members
    type: string
    description: "Explicit team members."
    merge_op: patch
    searchable: true
  - name: owned_assets
    type: string
    description: "Owned systems, projects, accounts, or assets."
    merge_op: patch
    searchable: true
  - name: interfaces
    type: string
    description: "Dependencies and interfaces with other teams."
    merge_op: patch
    searchable: true
  - name: rituals
    type: string
    description: "Recurring meetings or rituals."
    merge_op: patch
    searchable: true
  - name: conflicts
    type: string
    description: "Contradictions or uncertainty."
    merge_op: patch
    searchable: true
  - name: confidence
    type: string
    description: "low, medium, or high."
    merge_op: patch
  - name: last_observed
    type: string
    description: "Most recent observation date."
    merge_op: patch
  - name: custom_properties
    type: string
    description: "YAML-like key/value properties for durable company facts that belong to this memory but do not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: custom_sections
    type: string
    description: "Markdown sections for durable company knowledge that belongs to this memory but does not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: evidence
    type: string
    description: "Source metadata present in the input. Do not fabricate exact sources."
    merge_op: patch
    searchable: true
