memory_type: company_project

description: |
  Company project memory.

  Use for active or archived initiatives, client work, internal projects, product work,
  campaigns, launches, migrations, and operational programs.

  High priority:
  - project name, owner, team
  - status
  - goal/outcome
  - scope
  - milestones
  - blockers/risks
  - related customers/accounts
  - decisions and action items

directory: "viking://user/{{ user_space }}/memories/projects"
filename_template: "{{ project_slug }}.md"
enabled: true
operation_mode: "upsert"

overview_template: |-
  # Projects
  {% for item in items %}
  - [{{ item.file_content.project_name|default(item.file_content.project_slug, true) }}](./{{ item.file_name }})
    - status: {{ item.file_content.status|default("unknown", true) }};
    owner: {{ item.file_content.owner_slug|default("unknown", true) }}
  {% endfor %}

content_template: |-
  # {{ project_name|default(project_slug, true) }}

  ## Basic info
  - Slug: {{ project_slug|default("unknown", true) }}
  - Status: {{ status|default("unknown", true) }}
  - Owner: {{ owner_slug|default("unknown", true) }}
  - Team: {{ team_slug|default("unknown", true) }}
  - Last observed: {{ last_observed|default("unknown", true) }}
  - Confidence: {{ confidence|default("medium", true) }}

  ## Goal
  {{ goal|default("Unknown.", true) }}

  ## Scope
  {{ scope|default("Unknown.", true) }}

  ## Current status
  {{ current_status|default("Unknown.", true) }}

  ## Milestones
  {{ milestones|default("Unknown.", true) }}

  ## Blockers / risks
  {{ blockers_risks|default("Unknown.", true) }}

  ## Related people / teams
  {{ related_people_teams|default("Unknown.", true) }}

  ## Related customers / accounts
  {{ related_accounts|default("Unknown.", true) }}

  ## Related decisions
  {{ related_decisions|default("Unknown.", true) }}

  ## Custom properties
  {{ custom_properties|default("None recorded.", true) }}

  ## Custom sections
  {{ custom_sections|default("None recorded.", true) }}

  ## Evidence
  {{ evidence|default("Source metadata not available.", true) }}

fields:
  - name: project_slug
    type: string
    description: "Stable slug for the project."
    merge_op: immutable
    searchable: true
  - name: project_name
    type: string
    description: "Canonical project name."
    merge_op: patch
    searchable: true
  - name: status
    type: string
    description: "active, paused, archived, proposed, blocked, or unknown."
    merge_op: patch
    searchable: true
  - name: owner_slug
    type: string
    description: "Owner when explicitly known."
    merge_op: patch
    searchable: true
  - name: team_slug
    type: string
    description: "Owning or primary team."
    merge_op: patch
    searchable: true
  - name: goal
    type: string
    description: "Project goal or intended outcome."
    merge_op: patch
    searchable: true
  - name: scope
    type: string
    description: "In scope / out of scope."
    merge_op: patch
    searchable: true
  - name: current_status
    type: string
    description: "Current project state."
    merge_op: patch
    searchable: true
  - name: milestones
    type: string
    description: "Milestones, dates, and deliverables."
    merge_op: patch
    searchable: true
  - name: blockers_risks
    type: string
    description: "Blockers and risks."
    merge_op: patch
    searchable: true
  - name: related_people_teams
    type: string
    description: "Related people and teams."
    merge_op: patch
    searchable: true
  - name: related_accounts
    type: string
    description: "Related customers or accounts."
    merge_op: patch
    searchable: true
  - name: related_decisions
    type: string
    description: "Related decisions."
    merge_op: patch
    searchable: true
  - name: confidence
    type: string
    description: "low, medium, or high."
    merge_op: patch
  - name: last_observed
    type: string
    description: "Most recent observation date."
    merge_op: patch
  - name: custom_properties
    type: string
    description: "YAML-like key/value properties for durable company facts that belong to this memory but do not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: custom_sections
    type: string
    description: "Markdown sections for durable company knowledge that belongs to this memory but does not fit predefined fields."
    merge_op: patch
    searchable: true
  - name: evidence
    type: string
    description: "Source metadata present in the input. Do not fabricate exact sources."
    merge_op: patch
    searchable: true
