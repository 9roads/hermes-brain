memory_type: profile

description: |
  Disabled built-in user profile memory.

  Hermes uses OpenViking for shared company memory only. The company profile is
  represented by company_profile at viking://user/{{ user_space }}/memories/profile.md.

directory: "viking://user/{{ user_space }}/memories"
filename_template: "profile.md"
enabled: false
operation_mode: "upsert"

fields:
  - name: content
    type: string
    description: "Disabled built-in user profile content."
    merge_op: patch
